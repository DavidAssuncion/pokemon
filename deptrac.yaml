deptrac:
    paths:
        - src/
        - app/

    # Rutas que nunca deben analizarse aunque se amplíen `paths`.
    exclude_files:
        - tests/*
        - vendor/*

    layers:
        - name: Domain
          collectors:
              - type: classNameRegex
                value: '/^Src\\(.+)\\Domain\\(.+)$/'
        - name: Application
          collectors:
              - type: classNameRegex
                value: '/^Src\\(.+)\\App\\(.+)$/'
              - type: classNameRegex
                value: '/^Src\\(.+)\\Application\\(.+)$/'
        - name: Infrastructure
          collectors:
              - type: classNameRegex
                value: '/^Src\\(.+)\\Infra\\(.+)$/'
              - type: classNameRegex
                value: '/^Src\\(.+)\\Infrastructure\\(.+)$/'
        - name: Presentation
          collectors:
              - type: classNameRegex
                value: '/^Src\\(.+)\\Presentation\\(.+)$/'
              - type: classNameRegex
                value: '/^App\\(Http|Livewire|Console|View)\\(.+)$/'

    ruleset:
        Domain: []
        Application:
            - Domain
        Infrastructure:
            - Domain
            - Application
        Presentation:
            - Domain
            - Application
            - Infrastructure
